const login=()=>{setTimeout(gate,0);return `<div class="lg" id="cg" aria-live="polite"><h2>Checking your access…</h2></div>`};
async function gate(){const e=Q('#cg');if(!e)return;if(!ID.id||!DBH||!DBP()){e.innerHTML=msg('Sign-in required','Client access uses the account TAQVION invited. Open this link while signed in to that account. If you have not been invited, contact your TAQVION account manager. You can still explore the demo.');return}
try{const a=await DBH.doc('access/'+ID.id).get(),x=a.exists?a.data():null;
if(x&&x.status=='Active'){openWS(x.ind,ID.id);if(x.modules&&x.modules.length)W.mods=W.mods.filter(m=>x.modules.includes(m.t));W.co=x.name;W.cn='Owner';audit('Client login');clearInterval(window.__t);window.__t=setInterval(async()=>{try{const q=await DBH.doc('access/'+ID.id).get();if(!q.exists||q.data().status!='Active'){toast('Your access has changed. Signing out.');logout()}}catch{}},6e4);render();return}
if(x&&x.status=='Suspended'){e.innerHTML=msg('Access suspended','Your ERP access is currently suspended. Please contact your TAQVION account manager.');return}
if(x&&x.status=='Revoked'){e.innerHTML=msg('Access revoked','Your ERP access has been revoked. Please contact your TAQVION account manager.');return}
if(x&&x.status=='Rejected'){e.innerHTML=msg('Request not approved','TAQVION could not approve this access request. Please contact your account manager.');return}
const r=await DBH.doc('tenants/'+ID.id).get();if(r.exists){e.innerHTML=msg('Pending approval','Your ERP access is pending approval by TAQVION. Please contact your account manager.');return}
e.innerHTML=`<h2>Request ERP access</h2><p class="mu">Only the TAQVION Founder can approve production access.</p><div class="fm" style="margin-bottom:12px"><label>Have an invitation code from TAQVION?<input id="ic" maxlength="24" autocomplete="off"></label><div class="msg" id="im" role="alert"></div><button onclick="reqClaim()">Submit invitation code</button></div><p class="mu">No code? Request access:</p><form class="fm" onsubmit="reqAcc(event)"><label>Company name<input id="r1" required maxlength="80"></label><label>Contact person<input id="r2" required maxlength="80"></label><label>Email<input id="r3" type="email" required></label><div class="fg"><label>Country code<input id="r4" value="+91" pattern="\\+\\d{1,3}" required></label><label>WhatsApp number<input id="r5" pattern="\\d{6,12}" required></label></div><label>Industry<select id="r6">${IND.map(i=>`<option value="${i.id}">${E(i.name)}</option>`).join('')}</select></label><label>Note (optional)<input id="r7" maxlength="200"></label><label style="flex-direction:row;gap:8px"><input id="r8" type="checkbox"> I agree to receive WhatsApp messages from TAQVION</label><div class="msg" id="rm"></div><button class="pri">Submit request</button></form><p><button onclick="go('welcome')">← Home</button></p>`}catch(er){e.innerHTML=msg('Could not check access','Please try again later. '+E(String(er&&er.message||er).slice(0,80)))}}
async function reqAcc(ev){ev.preventDefault();const g=k=>Q('#'+k).value.trim();try{await DBH.doc('tenants/'+ID.id).set({name:g('r1'),contact:g('r2'),email:g('r3'),cc:g('r4'),wa:g('r5'),ind:g('r6'),note:g('r7'),optin:Q('#r8').checked,status:'Pending',at:new Date().toISOString()});Q('#cg').innerHTML=msg('Request submitted','Your ERP access is pending approval by TAQVION. Please contact your account manager.')}catch(e){Q('#rm').textContent='Could not submit the request: '+String(e&&e.message||e).slice(0,100)}}
const adm=()=>{if(!ID.owner)return denied();if(!FL){FL=1;loadFC().then(()=>{FL=2;render()}).catch(()=>{FL=2})}const T=[['ov','Overview'],['cl','Clients & requests'],['wa','WhatsApp'],['au','Audit log']];return `<div class="top"><div class="bar"><b style="font-size:18px">${logo(40)} <span>Founder console</span></b><span style="flex:1"></span><button onclick="FL=0;render()">Refresh</button><button onclick="go('welcome')">⌂ Home</button></div><div class="chips">${T.map(t=>`<button class="${A.at==t[0]?'on':''}" onclick="A.at='${t[0]}';A.pg=1;render()">${t[1]}</button>`).join('')}</div>${FL<2?'<p class="mu">Loading from the database…</p>':''}${{ov:aov,cl:acl,wa:awa,au:aau}[A.at]()}</div>`};

const ST=['Pending Invitation','Pending Approval','Active','Suspended','Rejected','Revoked'],sc=s=>s=='Active'?'ok':/Pending/.test(s)?'warn':'bad',OF=['name','contact','email','cc','wa','ind','address','country','modules','sub','renewal','notes','status','ownerId','inviteHash','inviteExp','createdAt','history','optin'];
async function reqClaim(){const c=Q('#ic').value.trim().toLowerCase();if(!/^[0-9a-f]{24}$/.test(c)){Q('#im').textContent='Enter the 24-character code you received.';return}try{await DBH.doc('tenants/'+ID.id).set({claim:c,at:new Date().toISOString()});Q('#cg').innerHTML=msg('Code submitted','Your ERP access is pending approval by TAQVION. Please contact your account manager.')}catch(e){Q('#im').textContent='Could not submit: '+String(e&&e.message||e).slice(0,80)}}
async function loadFC(){if(!ID.owner||!DBH)return;const[o,t,a]=await Promise.all([DBH.collection('orgs').get(),DBH.collection('tenants').get(),DBH.collection('access').get()]),ac={},rows=[],ln=new Set(),cl={};a.docs.forEach(d=>ac[d.id]=d.data());o.docs.forEach(d=>{const x=d.data();if(x.ownerId)ln.add(x.ownerId);rows.push({...x,id:d.id,kind:'org'})});t.docs.forEach(d=>{const x=d.data();if(x.claim)cl[d.id]=x.claim});
for(const[v,c]of Object.entries(cl)){const h=await sha(c),r=rows.find(r=>r.inviteHash==h&&!r.ownerId&&r.inviteExp>Date.now());if(r){r.claimBy=v;r.status='Pending Approval'}}
t.docs.forEach(d=>{const x=d.data();if(!ln.has(d.id)&&!x.claim)rows.push({...x,id:d.id,kind:'req',status:(ac[d.id]&&ac[d.id].status)||'Pending Approval',createdAt:x.at,history:[]})});FC=rows}
function aov(){const c=FC,n=s=>c.filter(x=>x.status==s).length,di={},soon=c.filter(x=>x.renewal&&x.renewal>=today&&x.renewal<=addD(30)),mo={};c.forEach(x=>{const k=(IND.find(i=>i.id==x.ind)||{}).name||'—';di[k]=(di[k]||0)+1;if(x.createdAt)mo[x.createdAt.slice(0,7)]=(mo[x.createdAt.slice(0,7)]||0)+1});let cum=0;const ks=Object.keys(mo).sort(),au=LS.g('tq_audit',[]).slice(0,6);
return `<div class="kp">${[['Client organizations',c.length],['Active',n('Active')],['Pending requests',n('Pending Approval')+n('Pending Invitation')],['Suspended',n('Suspended')],['Provisioned accounts',c.filter(x=>x.ownerId).length],['Renewals in 30 days',soon.length]].map(k=>`<div class="pn" style="margin:0"><small class="mu">${k[0]}</small><b style="font-size:22px;display:block">${k[1]}</b></div>`).join('')}</div><div class="cols"><div class="pn"><h3>Clients by industry</h3>${Object.entries(di).map(([k,v])=>`<div class="ln"><span>${E(k)}</span><b>${v}</b></div>`).join('')||'<p class="mu">No clients yet.</p>'}</div><div class="pn"><h3>Upcoming renewals</h3>${soon.map(x=>`<div class="ln"><span>${E(x.name)}</span><b>${x.renewal}</b></div>`).join('')||'<p class="mu">None in the next 30 days.</p>'}</div></div><div class="cols"><div class="pn"><h3>New clients by month</h3>${ks.length?`<table><tr><th>Month</th><th class="r">New</th><th class="r">Cumulative</th></tr>${ks.map(k=>`<tr><td>${k}</td><td class="r">${mo[k]}</td><td class="r">${cum+=mo[k]}</td></tr>`).join('')}</table>`:'<p class="mu">No dated records.</p>'}<small class="mu">Uses each record's creation time; undated records are excluded.</small></div><div class="pn"><h3>Recent activity</h3>${au.map(x=>`<div class="ln"><span>${E(x.a)}</span><small class="mu">${x.t.slice(5,16).replace('T',' ')}</small></div>`).join('')||'<p class="mu">No activity.</p>'}</div></div>`}
function acl(){const q=A.q.toLowerCase(),l=FC.filter(x=>(!A.st||x.status==A.st)&&(!A.ind||x.ind==A.ind)&&(!q||((x.name||'')+(x.contact||'')+(x.email||'')+(x.cc||'')+(x.wa||'')).toLowerCase().includes(q))).sort((a,b)=>A.so=='new'?(b.createdAt||'').localeCompare(a.createdAt||''):(a.name||'').localeCompare(b.name||'')),p=Math.min(A.pg,Math.max(1,Math.ceil(l.length/8)));
return `<div class="bar"><input type="search" placeholder="Search company, contact, email or phone…" value="${E(A.q)}" oninput="A.q=this.value;A.pg=1;render();const s=Q('input[type=search]');s.focus();s.setSelectionRange(99,99)"><select aria-label="Status" onchange="A.st=this.value;A.pg=1;render()"><option value="">All status</option>${ST.map(s=>`<option ${A.st==s?'selected':''}>${s}</option>`).join('')}</select><select aria-label="Industry" onchange="A.ind=this.value;A.pg=1;render()"><option value="">All industries</option>${IND.map(i=>`<option value="${i.id}" ${A.ind==i.id?'selected':''}>${E(i.name)}</option>`).join('')}</select><select aria-label="Sort" onchange="A.so=this.value;render()"><option value="name">Sort: name</option><option value="new" ${A.so=='new'?'selected':''}>Sort: newest</option></select><button class="pri" onclick="ncDlg()">+ Add client</button></div><div class="tw"><table><tr><th>Company</th><th>Contact</th><th>Industry</th><th>Status</th><th>Plan</th><th>Renewal</th><th></th></tr>${l.slice((p-1)*8,p*8).map(x=>`<tr><td>${E(x.name)}</td><td>${E(x.contact)}<br><small class="mu">${E(x.email)} · ${E(x.cc)} ${E(x.wa)}</small></td><td>${E((IND.find(i=>i.id==x.ind)||{}).name)}</td><td><span class="chip ${sc(x.status)}">${x.status}</span></td><td>${E(x.sub||'—')}</td><td>${E(x.renewal||'—')}</td><td><button onclick="cpf('${x.id}')">Open</button></td></tr>`).join('')||'<tr><td colspan="7" class="mu">No clients yet. Click Add client, or wait for access requests.</td></tr>'}</table></div><div class="pg">${pager(l.length,p,8,'apg')}</div>`}
const apg=p=>{A.pg=p;render()};
const fxM=(ind,sel)=>{const ms=mods(IND.find(i=>i.id==ind)||IND[0]).map(m=>m.t);Q('#n_mods').innerHTML=ms.map(t=>`<label style="flex-direction:row;gap:6px"><input type="checkbox" value="${E(t)}" ${!sel||sel.includes(t)?'checked':''}> ${E(t)}</label>`).join('')};
function ncDlg(id){const x=id?FC.find(y=>y.id==id):{cc:'+91',ind:IND[0].id,sub:'Trial'},f=(k,l,t='text',a='')=>`<label>${l}<input id="n_${k}" type="${t}" ${a} value="${E(x[k])}"></label>`;
DL.innerHTML=`<form onsubmit="saveNc(event,'${id||''}')"><h3>${id?'Edit':'Add'} client organization</h3><div class="fg">${f('name','Company name *','text','required maxlength=80')}${f('contact','Contact person *','text','required maxlength=80')}${f('email','Business email *','email','required')}${f('cc','Country code *','text','required pattern="\\+\\d{1,3}"')}${f('wa','WhatsApp number *','text','required pattern="\\d{6,12}"')}<label>Industry / ERP<select id="n_ind" onchange="fxM(this.value)">${IND.map(i=>`<option value="${i.id}" ${i.id==x.ind?'selected':''}>${E(i.name)}</option>`).join('')}</select></label>${f('address','Address','text','maxlength=160')}${f('country','Country','text','maxlength=60')}<label>Plan<select id="n_sub">${['Trial','Basic','Standard','Premium'].map(s=>`<option ${x.sub==s?'selected':''}>${s}</option>`).join('')}</select></label>${f('renewal','Renewal date','date')}</div><label>Assigned ERP modules<div id="n_mods" class="fg" style="gap:4px"></div></label>${f('notes','Internal notes','text','maxlength=300')}<div class="msg" id="ne" role="alert"></div><div class="act"><button type="button" onclick="DL.close()">Cancel</button><button class="pri" id="nsb">${id?'Save changes':'Create client and invitation'}</button></div></form>`;DL.showModal();fxM(x.ind,x.modules)}
const inCode=()=>[...crypto.getRandomValues(new Uint8Array(12))].map(b=>b.toString(16).padStart(2,'0')).join('');
async function putOrg(id,patch,msg){const c=FC.find(y=>y.id==id),d={};OF.forEach(k=>{if(c[k]!==undefined)d[k]=c[k]});Object.assign(d,patch);d.history=[{t:new Date().toISOString(),m:msg,by:'founder'},...(c.history||[])].slice(0,50);await DBH.doc('orgs/'+id).set(d);if(d.ownerId)await DBH.doc('access/'+d.ownerId).set({status:d.status,orgId:id,name:d.name,ind:d.ind,modules:d.modules||[],sub:d.sub||'',renewal:d.renewal||'',by:'founder',at:new Date().toISOString()});audit(msg+': '+d.name);await loadFC()}
async function saveNc(e,id){e.preventDefault();if(!ID.owner||!DBH){toast('Access denied.');return}const g=k=>Q('#n_'+k).value.trim(),em=g('email').toLowerCase(),er=[];if(!/^\S+@\S+\.\S+$/.test(em))er.push('Enter a valid business email.');if(!/^\d{6,12}$/.test(g('wa')))er.push('WhatsApp number must be 6–12 digits.');if(FC.some(x=>x.id!=id&&((x.email||'').toLowerCase()==em||(x.cc||'')+(x.wa||'')==g('cc')+g('wa')||(x.name||'').toLowerCase()==g('name').toLowerCase())))er.push('A client with the same name, email or phone already exists.');const mods=[...document.querySelectorAll('#n_mods input:checked')].map(i=>i.value);if(!mods.length)er.push('Select at least one module.');if(er.length){Q('#ne').innerHTML=er.map(E).join('<br>');return}
const v={name:g('name'),contact:g('contact'),email:em,cc:g('cc'),wa:g('wa'),ind:g('ind'),address:g('address'),country:g('country'),sub:g('sub'),renewal:g('renewal'),notes:g('notes'),modules:mods};Q('#nsb').disabled=true;
try{if(id){await putOrg(id,v,'Edited client');DL.close();render();toast('Client updated.')}else{const nid=crypto.randomUUID(),code=inCode(),d={...v,status:'Pending Invitation',createdAt:new Date().toISOString(),inviteHash:await sha(code),inviteExp:Date.now()+7*864e5,history:[{t:new Date().toISOString(),m:'Client created; invitation issued',by:'founder'}]};await DBH.doc('orgs/'+nid).set(d);audit('Created client '+v.name);await loadFC();render();invDlg(v,code)}}catch(er2){Q('#nsb').disabled=false;Q('#ne').textContent='Could not save: '+String(er2&&er2.message||er2).slice(0,100)}}
function invDlg(c,code){const m=`Hello ${c.contact}, your TAQVION ERP for ${c.name} is ready to activate. Open ${location.href} signed in to your TAQVION-invited account, choose "Your Own Product", and enter this invitation code: ${code} (valid 7 days). TAQVION will then activate your access.`;DL.innerHTML=`<h3>Invitation for ${E(c.name)}</h3><p class="mu">The code is shown only now and only its hash is stored. Email is not configured here, so copy it or send it by WhatsApp. It expires in 7 days.</p><label>Invitation code<input id="icode" readonly value="${code}"></label><label>Message<textarea id="imsg" rows="5" readonly>${E(m)}</textarea></label><div class="act"><button onclick="navigator.clipboard&&navigator.clipboard.writeText(Q('#imsg').value).then(()=>toast('Copied.'),()=>toast('Copy blocked: select the text manually.'))">Copy message</button><button class="pri" onclick="window.open('https://wa.me/${(c.cc+c.wa).replace(/\D/g,'')}?text='+encodeURIComponent(Q('#imsg').value),'_blank','noopener')||toast('Pop-up blocked.')">Open WhatsApp chat</button><button onclick="DL.close()">Done</button></div>`;DL.showModal()}
async function reInv(id){const c=FC.find(x=>x.id==id),code=inCode();try{await putOrg(id,{inviteHash:await sha(code),inviteExp:Date.now()+7*864e5,status:c.ownerId?c.status:'Pending Invitation'},'Invitation re-issued');render();invDlg(c,code)}catch(e){toast('Could not issue invitation: '+String(e&&e.message||e).slice(0,80))}}
function cpf(id){const c=FC.find(x=>x.id==id),b=(l,a)=>`<button onclick="cfm('${id}','${a}')">${l}</button>`,s=c.status;DL.innerHTML=`<h3>${E(c.name)} <span class="chip ${sc(s)}">${s}</span></h3>${[['Contact',c.contact],['Email',c.email],['Phone',(c.cc||'')+' '+(c.wa||'')],['Industry',(IND.find(i=>i.id==c.ind)||{}).name],['Plan / renewal',(c.sub||'—')+' / '+(c.renewal||'—')],['Address',[c.address,c.country].filter(Boolean).join(', ')],['Owner account',c.ownerId?'Linked':'Not linked yet'],['Created',(c.createdAt||'').slice(0,10)||'unknown'],['Notes',c.notes]].map(a=>`<div class="ln"><span>${a[0]}</span><b>${E(a[1])||'—'}</b></div>`).join('')}<div class="ln"><span>Modules</span><b>${E((c.modules||['(industry default)']).join(', '))}</b></div><h3>Access history</h3>${(c.history||[]).slice(0,8).map(h=>`<div class="ln"><span>${E(h.m)}</span><small class="mu">${h.t.slice(0,16).replace('T',' ')}</small></div>`).join('')||'<p class="mu">No history.</p>'}<div class="act" style="flex-wrap:wrap;margin-top:10px"><button onclick="window.open('https://wa.me/${((c.cc||'')+(c.wa||'')).replace(/\D/g,'')}?text='+encodeURIComponent('Hello ${E(c.contact||'')}, this is TAQVION regarding ${E(c.name||'')}.'),'_blank','noopener')||toast('Pop-up blocked.')">WhatsApp</button>${c.kind=='org'?`<button onclick="ncDlg('${id}')">Edit</button>`:''}${c.kind=='org'&&!c.ownerId?`<button onclick="reInv('${id}')">Resend invitation</button>`:''}${c.claimBy?b('Link account and activate','link'):''}${c.kind=='req'&&s!='Active'?`<button class="pri" onclick="appDlg('${id}')">Approve</button>`:''}${s=='Pending Approval'&&!c.claimBy?b('Reject','reject'):''}${s=='Active'?b('Suspend','suspend'):''}${/Suspended|Rejected|Revoked/.test(s)&&c.ownerId?b('Reactivate','react'):''}${/Active|Suspended/.test(s)?b('Revoke','revoke'):''}<button onclick="DL.close()">Close</button></div>`;DL.showModal()}
function cfm(id,a){const c=FC.find(x=>x.id==id);DL.innerHTML=`<h3>Confirm: ${a} ${E(c.name)}?</h3><p class="mu">This is recorded in the access history and audit log. Access changes apply to the client's next check (within about a minute for an open session).</p><div class="act"><button onclick="cpf('${id}')">Back</button><button class="pri" onclick="doAct('${id}','${a}')">Confirm</button></div>`}
async function doAct(id,a){if(!ID.owner||!DBH){toast('Access denied.');return}const c=FC.find(x=>x.id==id);try{if(a=='reject'&&c.kind=='req')await DBH.doc('access/'+id).set({status:'Rejected',name:c.name,by:'founder',at:new Date().toISOString()});else if(a=='link')await putOrg(id,{ownerId:c.claimBy,status:'Active',inviteHash:null},'Owner account linked; access activated');else await putOrg(id,{status:{suspend:'Suspended',revoke:'Revoked',react:'Active',reject:'Rejected'}[a]},{suspend:'Suspended',revoke:'Revoked',react:'Reactivated',reject:'Rejected'}[a]);audit(a+' '+c.name);await loadFC();DL.close();render();toast('Done: '+a+'.')}catch(e){toast('Could not save: '+String(e&&e.message||e).slice(0,100))}}
function appDlg(id){const c=FC.find(x=>x.id==id);DL.innerHTML=`<form onsubmit="doApp(event,'${id}')"><h3>Approve ${E(c.name)}</h3><label>Industry<select id="n_ind" onchange="fxM(this.value)">${IND.map(i=>`<option value="${i.id}" ${i.id==c.ind?'selected':''}>${E(i.name)}</option>`).join('')}</select></label><label>Plan<select id="n_sub"><option>Trial</option><option>Basic</option><option>Standard</option><option>Premium</option></select></label><label>Renewal date<input id="n_renewal" type="date"></label><label>Modules<div id="n_mods" class="fg" style="gap:4px"></div></label><div class="act"><button type="button" onclick="DL.close()">Cancel</button><button class="pri">Approve and activate</button></div></form>`;DL.showModal();fxM(c.ind)}
async function doApp(e,id){e.preventDefault();if(!ID.owner||!DBH)return;const c=FC.find(x=>x.id==id),mods=[...document.querySelectorAll('#n_mods input:checked')].map(i=>i.value);if(!mods.length){toast('Select at least one module.');return}const d={name:c.name,contact:c.contact,email:c.email,cc:c.cc,wa:c.wa,ind:Q('#n_ind').value,address:'',country:'',notes:c.note||'',optin:!!c.optin,modules:mods,sub:Q('#n_sub').value,renewal:Q('#n_renewal').value,status:'Active',ownerId:id,createdAt:c.createdAt||new Date().toISOString(),history:[{t:new Date().toISOString(),m:'Request approved; access activated',by:'founder'}]};try{await DBH.doc('orgs/'+id).set(d);await DBH.doc('access/'+id).set({status:'Active',orgId:id,name:d.name,ind:d.ind,modules:mods,sub:d.sub,renewal:d.renewal,by:'founder',at:new Date().toISOString()});audit('Approved '+d.name);await loadFC();DL.close();render();toast('Client approved and activated.')}catch(er){toast('Could not save: '+String(er&&er.message||er).slice(0,100))}}

render();whoami().then(hydrate).then(()=>{if(R.v=="welcome")render()});
